<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manouk Fransen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a3a2a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle noise texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Soft radial glow behind the text */
        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(61, 122, 85, 0.12) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        a {
            position: relative;
            z-index: 2;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.88);
            font-family: 'Syne', sans-serif;
            font-weight: 400;
            font-size: clamp(2.2rem, 5vw, 4.2rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            line-height: 1;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 1rem 0;
            opacity: 0;
            transform: translateY(12px);
            animation: arrive 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        a:hover {
            color: rgba(255, 255, 255, 1);
            letter-spacing: 0.18em;
        }

        a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
            transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        a:hover::after {
            width: 100%;
        }

        @keyframes arrive {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <a href="https://www.linkedin.com/in/manouk-fransen/" target="_blank" rel="noopener">Manouk Fransen</a>
</body>
</html>
